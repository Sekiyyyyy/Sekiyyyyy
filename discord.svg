      <path fill="#22d3ee"
        d="M524.531,69.836a1.5,1.5,0,0,0-.764-.7A485.065,485.065,0,0,0,404.081,32.03a1.816,1.816,0,0,0-1.923.91,337.461,337.461,0,0,0-14.9,30.6,447.848,447.848,0,0,0-134.426,0,309.541,309.541,0,0,0-15.135-30.6,1.89,1.89,0,0,0-1.924-.91A483.689,483.689,0,0,0,116.085,69.137a1.712,1.712,0,0,0-.788.676C39.068,183.651,18.186,294.69,28.43,404.354a1.9,1.9,0,0,0,.646,1.256A487.666,487.666,0,0,0,176.02,479.918a1.9,1.9,0,0,0,2.063-.676A348.2,348.2,0,0,0,208.12,430.4a1.86,1.86,0,0,0-1.019-2.588,321.173,321.173,0,0,1-45.868-21.853,1.885,1.885,0,0,1-.185-3.126c3.082-2.309,6.166-4.711,9.109-7.137a1.819,1.819,0,0,1,1.9-.256c96.229,43.917,200.41,43.917,295.5,0a1.812,1.812,0,0,1,1.924.233c2.944,2.426,6.027,4.851,9.132,7.16a1.884,1.884,0,0,1-.162,3.126,301.407,301.407,0,0,1-45.89,21.83,1.875,1.875,0,0,0-1,2.611,391.055,391.055,0,0,0,30.014,48.815,1.864,1.864,0,0,0,2.063.7A486.048,486.048,0,0,0,610.7,405.61a1.882,1.882,0,0,0,.646-1.24C623.729,277.594,590.933,167.465,524.531,69.836ZM222.491,337.58c-28.972,0-52.844-26.587-52.844-59.246s23.409-59.245,52.844-59.245c29.665,0,53.306,26.82,52.843,59.245C275.334,310.993,251.925,337.58,222.491,337.58Zm195.38,0c-28.971,0-52.843-26.587-52.843-59.246s23.409-59.245,52.843-59.245c29.667,0,53.307,26.82,52.844,59.245C470.715,310.993,447.538,337.58,417.871,337.58Z"/>
    </svg>
  </g>

  <!-- label -->
  <text x="66" y="35.0" font-family="'Fira Code','JetBrains Mono',ui-monospace,monospace"
        font-size="14.5" font-weight="700" letter-spacing="2.4" fill="#22d3ee">DISCORD</text>

  <!-- status line -->
  <g>
    <circle cx="70" cy="52.0" r="2.6" fill="#34d399">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.8s"
               begin="1.05s" repeatCount="indefinite"/>
    </circle>
    <text x="79" y="56.0" font-family="'Fira Code',ui-monospace,monospace"
          font-size="9.5" letter-spacing="1.6" fill="#1f6b5c">ACTIVE</text>
  </g>

  <!-- arrow -->
  <g stroke="#06b6d4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M226 34.0 l5 5 -5 5">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s"
               begin="1.05s" repeatCount="indefinite"/>
    </path>
    <path d="M232 34.0 l5 5 -5 5" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.2s"
               begin="1.3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>